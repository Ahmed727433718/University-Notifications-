name: Daily study brief

on:
  schedule:
    # Two runs so 07:00 Palestine time is covered before and after the clock change (UTC+3 / UTC+2).
    # The script only sends the notification when the local hour equals NOTIFY_HOUR.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send the notification now"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build page and notify
        run: python fetch_today.py
        env:
          CALENDAR_URL: ${{ secrets.CALENDAR_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FORCE_NOTIFY: ${{ inputs.force_notify && '1' || '0' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
